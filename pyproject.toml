[project]
name = "syncthing-mcp"
version = "0.1.0"
description = "Secure configurable Syncthing MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "sharkusmanch"}]
dependencies = ["mcp>=2.3.0,<3", "httpx>=0.28.1,<0.29", "pydantic>=2.13.5,<3", "uvicorn>=0.54.0,<0.55", "bcrypt>=5,<6"]

[project.scripts]
syncthing-mcp = "syncthing_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "pytest-asyncio>=1.4.0,<2", "pytest-cov>=7,<8", "ruff>=0.16.10,<0.17", "mypy>=1.19,<2", "respx>=0.23.1,<0.24", "build>=1.3,<2", "pip-audit==2.10.1"]
build = ["hatchling==1.32.4"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.coverage.run]
branch = true
source = ["syncthing_mcp"]
